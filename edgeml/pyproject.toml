[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeml"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python-headless", "pyyaml", "scipy", "tokenizers>=0.21,<0.22"]

[project.optional-dependencies]
eval = ["pycocotools", "faster-coco-eval", "trackeval @ git+https://github.com/JonathonLuiten/TrackEval.git", "matplotlib"]
tracking = ["boxmot>=13", "lap"]
detect = ["ultralytics>=8.3", "torch", "torchvision"]
test = ["pytest", "requests", "Pillow", "pycocotools"]
audit = ["pyarrow", "google-cloud-storage", "google-cloud-bigquery"]
# workstream B detectors (GPU eval box); CPU boxes install [onnx] only
gpu = ["torch", "torchvision", "ultralytics>=8.3", "transformers>=4.50", "timm", "huggingface_hub", "onnxruntime-gpu",
       "onnx", "onnxslim", "faster-coco-eval", "pillow"]
onnx = ["onnx", "onnxruntime", "onnxslim"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"edgeml.nightlights" = ["*.json"]
"edgeml.detectors" = ["marine_mammal_text.json"]
