# Split by source recording, never by frame. Tune on dev; evaluate test once per candidate.
# Workstream A owns this file and extends it as eval sets are added.
version: 1
rule: "split by source video / camera; adjacent frames never cross splits"
test:
  # locked held-out sources (do not tune on these)
  smd_vis_onboard_sample: [MVI_0797, MVI_0801]
  ghost_fleet_clips: [Spotted_A_Submarine, US_Destroyer_POV_Warship_Crossing, Ship_in_the_Distance_Ian, Dolphin_from_far_distance_in_Bay_of_Bengal]
  seaships7000: "upstream test split"
dev:
  smd_vis_onboard_sample: [MVI_0790, MVI_0799]
  ghost_fleet_clips: "all other clips"
  seaships7000: "upstream train/valid splits"
