# Split by source recording, never by frame. Tune on dev; evaluate test once per candidate.
version: 2
rule: "split by source video / camera; adjacent frames never cross splits"
source_video_aliases:
  Arriving_In_Norfolk_USA_3hr_uncut: Arriving_In_Norfolk
quarantine:
  fvessel_clip10: [fvessel_clip05]  # all 185 frames exactly overlap locked clip07
test:
  # locked held-out sources (do not tune on these)
  smd_vis_onboard_sample: [MVI_0797, MVI_0801]
  ghost_fleet_clips: [Spotted_A_Submarine, US_Destroyer_POV_Warship_Crossing, Ship_in_the_Distance_Ian, Dolphin_from_far_distance_in_Bay_of_Bengal, Sailboat_on_the_horizon, Arriving_In_Norfolk_USA_3hr_uncut, Cruise_Ship_Docked_in_Ocean_with_Dingy_Boats, Ferry_Passing_By_On_River]
  seaships7000: "upstream test split"
  # MOT identity sets (edgeml/eval/<set>/, workstream A). Same source clip => same split as ghost_fleet_clips above.
  ghost_fleet_5fps:
    - Spotted_A_Submarine
    - Ship_in_the_Distance_Ian
    - Dolphin_from_far_distance_in_Bay_of_Bengal
