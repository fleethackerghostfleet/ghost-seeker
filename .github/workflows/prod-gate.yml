name: prod-gate

# Production contract (AGENTS.md). Admins: mark the `prod-gate` check as
# required on `prod` in branch protection (docs/FIELDING.md).
on:
  pull_request:
    branches: [prod, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prod-gate:
    name: prod-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: TestProdContract (prod build, must run)
        shell: bash
        run: |
          set -o pipefail
          go test -tags prod -count=1 -v -run '^TestProdContract' ./... | tee contract.log
          grep -q -- '--- PASS: TestProdContract' contract.log
      - name: make prod-gate
        run: make prod-gate
