name: Security gates

on:
  pull_request:
    branches: [dev, main, prod]
  push:
    branches: [prod]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/security-install.sh secrets
      - name: Scan PR commits or full history (redacted)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if [[ -n "$BASE" ]]; then
            make security-secrets GITLEAKS_LOG_OPTS="$BASE..$HEAD"
          else
            make security-secrets
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: secrets
          path: dist/security/*.json
          retention-days: 14

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: git lfs pull --include web/static/imagery/empty-ocean.zip --exclude=""
      - run: bash scripts/security-install.sh go
      - run: make security-go
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: go-security
          path: dist/security/*.json
          retention-days: 14

  python-and-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: git lfs pull --include web/static/imagery/empty-ocean.zip --exclude=""
      - run: |
          bash scripts/security-install.sh python
          go install github.com/google/go-licenses/v2@v2.0.1
      - run: make security-python
      - run: make security-licenses
        if: success() || failure()
      - run: python3 -m unittest discover -s scripts -p 'test_security.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: python-licenses
          path: dist/security/
          retention-days: 14

  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: |
          bash scripts/security-install.sh manifests
          python3 -m venv .venv/manifests
          .venv/manifests/bin/pip install PyYAML==6.0.3
      - run: |
          export PATH="$HOME/.local/bin:$PATH"
          make security-config SECURITY_PYTHON=.venv/manifests/bin/python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: manifests
          path: dist/security/
          retention-days: 14

  images:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/prod') ||
      (github.event_name == 'pull_request' && github.base_ref == 'prod')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: git lfs pull --include web/static/imagery/empty-ocean.zip --exclude=""
      - run: bash scripts/security-install.sh images
      - run: make images
      - run: |
          export PATH="$HOME/.local/bin:$PATH"
          make sbom
      - run: |
          export PATH="$HOME/.local/bin:$PATH"
          make scan
      - name: Publish scanned images by immutable digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          for name in shore edge operator edgeml-sidecar; do
            ref="$registry/$name:$GITHUB_SHA"
            docker tag "ghost-seeker/$name:0.1.0" "$ref"
            docker push "$ref"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$ref")
            printf '%s %s\n' "$name" "$digest" >> dist/security/images.txt
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: image-evidence
          path: dist/security/
          retention-days: 30

  sign:
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    needs: [secrets, go, python-and-licenses, manifests, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-evidence
          path: evidence
      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
        with:
          cosign-release: v2.4.3
      - name: Keyless sign and attest SBOMs (never PRs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          while read -r name ref; do
            cosign sign --yes "$ref"
            cosign attest --yes --type cyclonedx --predicate "evidence/$name.cdx.json" "$ref"
            cosign attest --yes --type spdxjson --predicate "evidence/$name.spdx.json" "$ref"
          done < evidence/images.txt
