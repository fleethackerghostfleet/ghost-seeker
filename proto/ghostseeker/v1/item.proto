syntax = "proto3";

package ghostseeker.v1;

option go_package = "github.com/fleethackerghostfleet/ghost-seeker/gen/ghostseeker/v1;ghostseekerv1";

// Item is the unit of prioritization. Every captured thing (image, record,
// telemetry window, digest) is an Item with one or more Forms, ordered from
// cheapest/lowest fidelity to full fidelity. The scheduler decides which
// (item, form) pairs leave the ship and when. Items are never deleted on the
// edge; "deprioritized" items simply sort last.
message Item {
  string id = 1; // ULID, time-ordered
  ItemType type = 2;
  int64 captured_at_unix_ms = 3;
  string source = 4; // sensor / device / operator that produced it
  Geo geo = 5;
  string content_hash = 6; // sha256 of the full-fidelity payload (dedup key)
  Features features = 7;
  repeated Form forms = 8; // ordered by FormKind ascending
  int64 ingest_seq = 9; // monotonic per edge, used by FIFO baseline
}

enum ItemType {
  ITEM_TYPE_UNSPECIFIED = 0;
  ITEM_TYPE_IMAGE = 1;
  ITEM_TYPE_RECORD = 2; // small structured record (contact report, CASREP, ...)
  ITEM_TYPE_TELEMETRY = 3;
  ITEM_TYPE_DIGEST = 4; // periodic summary generated by the edge
}

// FormKind is the fidelity ladder. Each ItemType uses a subset; the order is
// always ascending cost. FACT is <= ~1 KB and is what the scheduler sends
// first for every item regardless of interest.
enum FormKind {
  FORM_KIND_UNSPECIFIED = 0;
  FORM_KIND_FACT = 1; // structured summary: labels, confidence, geo, time
  FORM_KIND_THUMB = 2; // small preview (image: ~160px WebP/JPEG; telemetry: downsampled)
  FORM_KIND_CROP = 3; // detection crop(s) at native resolution
  FORM_KIND_FULL = 4; // full-fidelity payload
}

message Form {
  FormKind kind = 1;
  int64 bytes = 2;
  string content_hash = 3;
  string mime = 4;
  bool ready = 5; // produced and stored locally
}

message Geo {
  double lat = 1;
  double lon = 2;
  double heading_deg = 3;
}

message Box {
  float x = 1; // normalized 0..1
  float y = 2;
  float w = 3;
  float h = 4;
}

message Detection {
  string label = 1;
  float confidence = 2;
  Box box = 3;
}

// Features is everything scorers may read. Produced by the inference engine
// (interchangeable) plus operator overrides.
message Features {
  repeated Detection detections = 1;
  repeated float embedding = 2; // image/text joint embedding, L2-normalized
  string model_id = 3;
  // Unknownness in [0,1]: 1 = nothing recognized / far from all known classes.
  float unknownness = 4;
  string label_override = 5; // set by a human; wins over detections
  string override_by = 6;
  map<string, string> tags = 7;
}

// Score is the scheduler's current opinion of an item, with reasons so the
// UI can explain "why is this first".
message Score {
  double priority = 1;
  repeated Reason reasons = 2;
  int64 computed_at_unix_ms = 3;
  bool suppressed = 4; // matched a negative interest; still manifested + FACT sent
}

message Reason {
  string scorer = 1;
  double value = 2;
  string note = 3;
}
