kind: UDSBundle
metadata:
  name: ghost-seeker-prod-uds
  version: 0.1.0
  architecture: amd64
packages:
  - name: init
    repository: ghcr.io/zarf-dev/packages/init
    ref: v0.89.0
    keylessVerification:
      certificateIdentityRegexp: https://github\.com/zarf-dev/zarf/\.github/workflows/release\.yml@refs/tags/v\d+\.\d+\.\d+
      certificateOIDCIssuer: https://token.actions.githubusercontent.com
  - name: core
    repository: ghcr.io/defenseunicorns/packages/uds/core
    # Use registry1 flavor for IL environments; core-slim-dev bundle for local development.
    ref: 1.16.0-upstream
    keylessVerification:
      certificateIdentityRegexp: https://github\.com/defenseunicorns/uds-core/\.github/workflows/publish\.yaml@refs/tags/v\d+\.\d+\.\d+
      certificateOIDCIssuer: https://token.actions.githubusercontent.com
  - name: ghost-seeker
    path: ../../dist
    ref: 0.1.0
    optionalComponents:
      - uds-package
      - edge-inference
