# Dev/demo topology: shore <- toxiproxy <- edge. Degrade the link with the
# toxiproxy API (see README). Mount frames to replay.
services:
  ghost-seeker-piv:
    profiles: ["piv"]
    build: { context: ../.., dockerfile: deploy/Dockerfile, target: operator, args: { GO_TAGS: "" } }
    image: ghost-seeker/operator:0.1.0
    command: ["-addr", ":8443", "-shore", "http://shore:8080", "-edge", "http://edge:8081", "-link-listen", ""]
    environment:
      GS_AUTH_MODE: piv
      GS_TLS_CERT: /etc/ghost-seeker/tls/server.crt
      GS_TLS_KEY: /etc/ghost-seeker/tls/server.key
      GS_PIV_CA_BUNDLE: /etc/ghost-seeker/pki/ca-bundle
      GS_PIV_CRL_DIR: /etc/ghost-seeker/pki/crl
      GS_PIV_CRL_GRACE: "0s"
      GS_PIV_RELOAD: "1m"
      GS_PIV_OCSP_URL: ""
      GS_PIV_POLICY_OIDS: ${GS_PIV_POLICY_OIDS:-}
      GS_PIV_USERS: /etc/ghost-seeker/users.yaml
      GS_OPERATOR_TOKEN: ${GS_OPERATOR_TOKEN:?set GS_OPERATOR_TOKEN (>=16 bytes) for the shore/edge consoles}
      GS_DEV_TOKEN_FILE: none
    ports: ["8443:8443"]
    volumes:
      - ${GS_PIV_TLS_DIR:-../../data/piv-demo}:/etc/ghost-seeker/tls:ro
      - ${GS_PIV_CA_DIR:-../../data/piv-demo/ca-bundle}:/etc/ghost-seeker/pki/ca-bundle:ro
      - ${GS_PIV_CRL_DIR:-../../data/piv-demo/crl}:/etc/ghost-seeker/pki/crl:ro
      - ${GS_PIV_USERS_FILE:-../../data/piv-demo/users.yaml}:/etc/ghost-seeker/users.yaml:ro
    depends_on: [shore]

  shore:
    build: { context: ../.., dockerfile: deploy/Dockerfile, target: shore, args: { GO_TAGS: "" } }
    image: ghost-seeker/shore:0.1.0
    entrypoint: ["/usr/local/bin/shore"]
    command: ["-data", "/data/shore", "-listen", ":8080", "-ui", "/ui"]
    environment:
      # Production posture: no auto-generated dev token; operators must set GS_OPERATOR_TOKEN.
      GS_OPERATOR_TOKEN: ${GS_OPERATOR_TOKEN:?set GS_OPERATOR_TOKEN (>=16 bytes) for the shore/edge consoles}
      GS_DEV_TOKEN_FILE: none
      # Unit (edge->shore) auth is mandatory in production: mint edge tokens with cmd/mint-unit-token.
      GS_REQUIRE_AUTH: "true"
      GS_SIGNING_KEY: ${GS_SIGNING_KEY:?set GS_SIGNING_KEY (>=32 bytes) for unit JWTs}
      # Edge reaches shore through toxiproxy as http://link:18080 (Host: link:18080).
      GS_PUBLIC_HOSTS: "shore,link,localhost"
    ports: ["8080:8080"]
    volumes: ["shore-data:/data"]

  link:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host", "0.0.0.0", "-config", "/config/toxiproxy.json"]
    volumes: ["./toxiproxy.json:/config/toxiproxy.json:ro"]
    ports: ["8474:8474"]   # toxiproxy admin API
    depends_on: [shore]

  edge:
    build: { context: ../.., dockerfile: deploy/Dockerfile, target: edge, args: { GO_TAGS: "" } }
    image: ghost-seeker/edge:0.1.0
    command: ["-data", "/data/edge", "-listen", ":8081", "-shore", "http://link:18080", "-frames", "/frames", "-period", "2s", "-ui", "/ui"]
    environment:
      GS_OPERATOR_TOKEN: ${GS_OPERATOR_TOKEN:?set GS_OPERATOR_TOKEN (>=16 bytes) for the shore/edge consoles}
      GS_DEV_TOKEN_FILE: none
      GS_UNIT_TOKEN: ${GS_UNIT_TOKEN:?set GS_UNIT_TOKEN (edge JWT from cmd/mint-unit-token)}
      GS_PUBLIC_HOSTS: "edge,localhost"
    ports: ["8081:8081"]
    volumes: ["edge-data:/data", "../../frames:/frames:ro"]
    depends_on: [link]

volumes:
  shore-data:
  edge-data:
