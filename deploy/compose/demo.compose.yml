# Laptop demo in Docker (docs/DEMO.md "Run it in Docker"): the four
# `make demo-*` processes as containers, nothing to install but Docker.
#
#   make compose-demo          # build + up, then open http://localhost:8090
#   make compose-demo-down     # stop and delete data + credentials (fresh replay)
#
# Prerequisites on the host (one-time; gh auth login while the repo is private):
#   make demo-clips            # scenarios/ghostfleet_demo/frames (gitignored)
#   make demo-models           # ~/models/D (override with MODELS=/path or GS_MODELS)
#
# This is NOT the fielding topology (docker-compose.yml): auth is the dev
# token path (`init` writes the operator token, unit key and edge JWT into
# the `demo-secrets` volume), the link is the operator UI's in-process
# shaper (automatic 0–50 Mbps bandwidth), and ports bind to 127.0.0.1 only.
name: ghost-seeker-demo

x-build: &go-build
  context: ../..
  dockerfile: deploy/Dockerfile

services:
  init:
    build: { <<: *go-build, target: demo-init }
    image: ghost-seeker/demo-init:0.1.0
    environment:
      EDGE_ID: edge-1
      UNIT_TOKEN_TTL: 24h
    volumes: ["demo-secrets:/secrets"]

  sidecar:
    # The fielding image (edgeml/Dockerfile, CI's edgeml-sidecar) with the
    # tracking extra: CPU torch from the PyTorch index (x86-64 and arm64) + boxmot.
    build: { context: ../../edgeml, dockerfile: Dockerfile, args: { WITH_TRACKING: "1" } }
    image: ghost-seeker/edgeml-sidecar:0.1.0-tracking
    command: ["--listen", "0.0.0.0:9090", "--detector", "/models/yolo11n-640/model.onnx", "--embed", "/models/mobileclip-s1",
              "--threads", "4", "--fps", "5", "--prioritizer", "both"]
    environment:
      GHOST_PRIORITY_PATH: /opt/algorithm   # Tomer's ghost_priority for --prioritizer both (numpy + opencv only)
    volumes:
      - "${GS_MODELS:-~/models/D}:/models:ro"
      - "../../algorithm:/opt/algorithm:ro"
      # edgeml.nightlights resolves internal/catalog relative to the repo root; in the venv that is /opt/venv/lib
      - "../../internal/catalog:/opt/venv/lib/internal/catalog:ro"
    healthcheck:
      # no curl in the image; the edge waits for this (depends_on: service_healthy)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s

  shore:
    build: { <<: *go-build, target: shore }
    image: ghost-seeker/shore:0.1.0
    command: ["-data", "/data/shore", "-listen", ":8080", "-ui", "/ui",
              "-dev-token-file", "/secrets/operator.token", "-signing-key-file", "/secrets/unit.key"]
    environment:
      # ui reaches shore as http://shore:8080; the edge's traffic arrives through
      # the ui's shaper with Host ui:18080. `link` keeps degrade.sh usable.
      GS_PUBLIC_HOSTS: "shore,ui,link,localhost"
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["shore-data:/data", "demo-secrets:/secrets:ro"]
    depends_on:
      init: { condition: service_completed_successfully }

  ui:
    build: { <<: *go-build, target: operator }
    image: ghost-seeker/operator:0.1.0
    command: ["-addr", ":8090", "-shore", "http://shore:8080", "-edge", "http://edge:8081", "-link-listen", ":18080",
              "-dev-token-file", "/secrets/operator.token", "-dev-trust-peers", "-demo-accept-any-token", "-demo-link-control"]
    # 127.0.0.1 only: with -dev-trust-peers a browser on this Mac is signed in
    # automatically (its connection reaches the container from Docker's bridge
    # gateway, not loopback); nothing else can reach the port.
    ports: ["127.0.0.1:8090:8090"]
    volumes: ["demo-secrets:/secrets:ro"]
    depends_on:
      init: { condition: service_completed_successfully }
      shore: { condition: service_started }

  edge:
    build: { <<: *go-build, target: edge }
    image: ghost-seeker/edge:0.1.0
    command: ["-id", "edge-1", "-data", "/data/edge", "-listen", ":8081", "-ui", "/ui",
              "-shore", "http://ui:18080", "-scenario", "/demo/live.json", "-period", "200ms",
              "-infer", "http://sidecar:9090", "-dedup", "sightings", "-prioritizer", "edgeml",
              "-dev-token-file", "/secrets/operator.token", "-unit-token-file", "/secrets/edge-1.jwt"]
    environment:
      GS_PUBLIC_HOSTS: "edge,localhost"
    ports: ["127.0.0.1:8081:8081"]
    volumes:
      - "edge-data:/data"
      - "demo-secrets:/secrets:ro"
      - "../../scenarios/ghostfleet_demo:/demo:ro"   # scenario.json + frames/ (make demo-clips)
    depends_on:
      init: { condition: service_completed_successfully }
      sidecar: { condition: service_healthy }
      shore: { condition: service_started }
      ui: { condition: service_started }

volumes:
  shore-data:
  edge-data:
  demo-secrets:
