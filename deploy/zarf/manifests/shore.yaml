apiVersion: v1
kind: ConfigMap
metadata:
  name: shore-config
  namespace: "###ZARF_VAR_NAMESPACE###"
data:
  DATA_DIR: /data
  LISTEN: :8080
  GS_PUBLIC_HOSTS: "###ZARF_VAR_SHORE_PUBLIC_HOSTS###,###ZARF_VAR_SHORE_GATEWAY_HOST###.###ZARF_VAR_DOMAIN###"
  UI_DIR: /ui
  INFER_URL: "###ZARF_VAR_SHORE_INFER_URL###"
  GS_REQUIRE_AUTH: "###ZARF_VAR_SHORE_REQUIRE_AUTH###"
  GS_DEV_TOKEN_FILE: none
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shore
  namespace: "###ZARF_VAR_NAMESPACE###"
spec:
  serviceName: shore
  replicas: 1
  selector:
    matchLabels:
      app: shore
  template:
    metadata:
      annotations:
        ghost-seeker.io/public-hosts: "###ZARF_VAR_SHORE_PUBLIC_HOSTS###,###ZARF_VAR_SHORE_GATEWAY_HOST###.###ZARF_VAR_DOMAIN###"
        ghost-seeker.io/listener-tls-secret: "###ZARF_VAR_SHORE_TLS_SECRET###"
      labels:
        app: shore
    spec:
      imagePullSecrets:
        - name: private-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shore
          image: "###ZARF_REGISTRY###/ghost-seeker/shore:prod-b6e0f0fa18d1-20261106160717-221ead34"
          imagePullPolicy: IfNotPresent
{{ if ne "###ZARF_VAR_SHORE_TLS_SECRET###" "" }}
          args:
            - "-tls-cert=/run/listener-tls/tls.crt"
            - "-tls-key=/run/listener-tls/tls.key"
{{ end }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: shore-config
          env:
            - name: GS_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: "###ZARF_VAR_SHORE_AUTH_SECRET###"
                  key: "###ZARF_VAR_SHORE_SIGNING_KEY_KEY###"
            - name: GS_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "###ZARF_VAR_SHORE_AUTH_SECRET###"
                  key: "###ZARF_VAR_SHORE_OPERATOR_TOKEN_KEY###"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
{{ if ne "###ZARF_VAR_SHORE_TLS_SECRET###" "" }}
              scheme: HTTPS
{{ end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
{{ if ne "###ZARF_VAR_SHORE_TLS_SECRET###" "" }}
              scheme: HTTPS
{{ end }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
{{ if ne "###ZARF_VAR_SHORE_TLS_SECRET###" "" }}
            - name: listener-tls
              mountPath: /run/listener-tls
              readOnly: true
{{ end }}
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
{{ if ne "###ZARF_VAR_SHORE_TLS_SECRET###" "" }}
        - name: listener-tls
          secret:
            secretName: "###ZARF_VAR_SHORE_TLS_SECRET###"
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
{{ end }}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
{{ if ne "###ZARF_VAR_SHORE_STORAGE_CLASS###" "" }}
        storageClassName: "###ZARF_VAR_SHORE_STORAGE_CLASS###"
{{ end }}
        resources:
          requests:
            storage: "###ZARF_VAR_SHORE_STORAGE###"
---
apiVersion: v1
kind: Service
metadata:
  name: shore
  namespace: "###ZARF_VAR_NAMESPACE###"
spec:
  type: ClusterIP
  selector:
    app: shore
  ports:
    - name: http
      port: 8080
      appProtocol: http2
      targetPort: http
