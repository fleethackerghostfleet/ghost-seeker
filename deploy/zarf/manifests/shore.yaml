apiVersion: v1
kind: ConfigMap
metadata:
  name: shore-config
  namespace: ghost-seeker
data:
  DATA_DIR: /data
  LISTEN: :8080
  GS_PUBLIC_HOSTS: "###ZARF_VAR_SHORE_PUBLIC_HOSTS###"
  UI_DIR: /ui
  INFER_URL: "###ZARF_VAR_SHORE_INFER_URL###"
  GS_REQUIRE_AUTH: "###ZARF_VAR_SHORE_REQUIRE_AUTH###"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shore
  namespace: ghost-seeker
spec:
  serviceName: shore
  replicas: 1
  selector:
    matchLabels:
      app: shore
  template:
    metadata:
      annotations:
        ghost-seeker.io/listener-tls-secret: "###ZARF_VAR_SHORE_TLS_SECRET###"
      labels:
        app: shore
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shore
          image: ghost-seeker/shore:0.1.0
          imagePullPolicy: IfNotPresent
{{ if ne "###ZARF_VAR_SHORE_TLS_SECRET###" "" }}
          args:
            - "-tls-cert=/run/listener-tls/tls.crt"
            - "-tls-key=/run/listener-tls/tls.key"
{{ end }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: shore-config
          env:
            - name: GS_DEV_TOKEN_FILE
              value: none
            - name: GS_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: shore-auth
                  key: signing-key
            - name: GS_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shore-auth
                  key: operator-token
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
{{ if ne "###ZARF_VAR_SHORE_TLS_SECRET###" "" }}
              scheme: HTTPS
{{ end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
{{ if ne "###ZARF_VAR_SHORE_TLS_SECRET###" "" }}
              scheme: HTTPS
{{ end }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
{{ if ne "###ZARF_VAR_SHORE_TLS_SECRET###" "" }}
            - name: listener-tls
              mountPath: /run/listener-tls
              readOnly: true
{{ end }}
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
{{ if ne "###ZARF_VAR_SHORE_TLS_SECRET###" "" }}
        - name: listener-tls
          secret:
            secretName: "###ZARF_VAR_SHORE_TLS_SECRET###"
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
{{ end }}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "###ZARF_VAR_SHORE_STORAGE###"
---
apiVersion: v1
kind: Service
metadata:
  name: shore
  namespace: ghost-seeker
spec:
  type: ClusterIP
  selector:
    app: shore
  ports:
    - name: http
      port: 8080
      targetPort: http
