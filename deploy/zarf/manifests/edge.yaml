apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-config
  namespace: "###ZARF_VAR_NAMESPACE###"
data:
  EDGE_ID: "###ZARF_VAR_EDGE_ID###"
  DATA_DIR: /data
  LISTEN: :8081
  GS_PUBLIC_HOSTS: "###ZARF_VAR_EDGE_PUBLIC_HOSTS###,###ZARF_VAR_EDGE_GATEWAY_HOST###.###ZARF_VAR_DOMAIN###"
  SHORE_URL: "{{ if and (ne "###ZARF_VAR_SHORE_TLS_SECRET###" "") (eq "###ZARF_VAR_SHORE_URL###" "http://shore.ghost-seeker.svc.cluster.local:8080") }}https://shore.ghost-seeker.svc.cluster.local:8080{{ else }}###ZARF_VAR_SHORE_URL###{{ end }}"
  INFER_URL: "###ZARF_VAR_INFER_URL###"
  DEDUP: hash
  UI_DIR: /ui
  GS_EDGE_MAX_BYTES: "###ZARF_VAR_EDGE_MAX_BYTES###"
  GS_EDGE_MAX_ITEMS: "###ZARF_VAR_EDGE_MAX_ITEMS###"
  GS_DEV_TOKEN_FILE: none
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: edge
  namespace: "###ZARF_VAR_NAMESPACE###"
spec:
  serviceName: edge
  replicas: 1
  selector:
    matchLabels:
      app: edge
  template:
    metadata:
      annotations:
        ghost-seeker.io/listener-tls-secret: "###ZARF_VAR_EDGE_TLS_SECRET###"
        ghost-seeker.io/shore-tls-secret: "###ZARF_VAR_SHORE_TLS_SECRET###"
        ghost-seeker.io/shore-ca-secret: "###ZARF_VAR_SHORE_CA_SECRET###"
        ghost-seeker.io/shore-url: "{{ if and (ne "###ZARF_VAR_SHORE_TLS_SECRET###" "") (eq "###ZARF_VAR_SHORE_URL###" "http://shore.ghost-seeker.svc.cluster.local:8080") }}https://shore.ghost-seeker.svc.cluster.local:8080{{ else }}###ZARF_VAR_SHORE_URL###{{ end }}"
      labels:
        app: edge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: edge
          image: ghost-seeker/edge:prod-b6e0f0fa18d1-20261106160717-221ead34
          imagePullPolicy: IfNotPresent
{{ if or (ne "###ZARF_VAR_EDGE_TLS_SECRET###" "") (ne "###ZARF_VAR_SHORE_CA_SECRET###" "") }}
          args:
{{ if ne "###ZARF_VAR_EDGE_TLS_SECRET###" "" }}
            - "-tls-cert=/run/listener-tls/tls.crt"
            - "-tls-key=/run/listener-tls/tls.key"
{{ end }}
{{ if ne "###ZARF_VAR_SHORE_CA_SECRET###" "" }}
            - "-shore-ca=/run/shore-ca/ca.crt"
{{ end }}
{{ end }}
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: edge-config
          env:
            - name: GS_UNIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "###ZARF_VAR_EDGE_AUTH_SECRET###"
                  key: "###ZARF_VAR_EDGE_UNIT_TOKEN_KEY###"
            - name: GS_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "###ZARF_VAR_EDGE_AUTH_SECRET###"
                  key: "###ZARF_VAR_EDGE_OPERATOR_TOKEN_KEY###"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
{{ if ne "###ZARF_VAR_EDGE_TLS_SECRET###" "" }}
              scheme: HTTPS
{{ end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
{{ if ne "###ZARF_VAR_EDGE_TLS_SECRET###" "" }}
              scheme: HTTPS
{{ end }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
{{ if ne "###ZARF_VAR_EDGE_TLS_SECRET###" "" }}
            - name: listener-tls
              mountPath: /run/listener-tls
              readOnly: true
{{ end }}
{{ if ne "###ZARF_VAR_SHORE_CA_SECRET###" "" }}
            - name: shore-ca
              mountPath: /run/shore-ca
              readOnly: true
{{ end }}
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: frames
              mountPath: /frames
              readOnly: true
      volumes:
{{ if ne "###ZARF_VAR_EDGE_TLS_SECRET###" "" }}
        - name: listener-tls
          secret:
            secretName: "###ZARF_VAR_EDGE_TLS_SECRET###"
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
{{ end }}
{{ if ne "###ZARF_VAR_SHORE_CA_SECRET###" "" }}
        - name: shore-ca
          secret:
            secretName: "###ZARF_VAR_SHORE_CA_SECRET###"
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
{{ end }}
        - name: tmp
          emptyDir: {}
{{ if eq "###ZARF_VAR_FRAMES_SOURCE###" "hostPath" }}
        - name: frames
          hostPath:
            path: "###ZARF_VAR_FRAMES_HOSTPATH###"
            type: DirectoryOrCreate
{{ end }}
  volumeClaimTemplates:
{{ if eq "###ZARF_VAR_FRAMES_SOURCE###" "pvc" }}
    - metadata:
        name: frames
      spec:
        accessModes: ["ReadWriteOnce"]
{{ if ne "###ZARF_VAR_FRAMES_STORAGE_CLASS###" "" }}
        storageClassName: "###ZARF_VAR_FRAMES_STORAGE_CLASS###"
{{ end }}
        resources:
          requests:
            storage: "###ZARF_VAR_FRAMES_STORAGE###"
{{ end }}
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
{{ if ne "###ZARF_VAR_EDGE_STORAGE_CLASS###" "" }}
        storageClassName: "###ZARF_VAR_EDGE_STORAGE_CLASS###"
{{ end }}
        resources:
          requests:
            storage: "###ZARF_VAR_EDGE_STORAGE###"
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: "###ZARF_VAR_NAMESPACE###"
spec:
  type: ClusterIP
  selector:
    app: edge
  ports:
    - name: http
      port: 8081
      targetPort: http
