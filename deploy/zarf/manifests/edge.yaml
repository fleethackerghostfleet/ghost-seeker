apiVersion: v1
kind: Namespace
metadata:
  name: ghost-seeker
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-config
  namespace: ghost-seeker
data:
  EDGE_ID: "###ZARF_VAR_EDGE_ID###"
  DATA_DIR: /data
  LISTEN: :8081
  SHORE_URL: "###ZARF_VAR_SHORE_URL###"
  INFER_URL: "###ZARF_VAR_INFER_URL###"
  DEDUP: hash
  UI_DIR: /ui
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: edge
  namespace: ghost-seeker
spec:
  serviceName: edge
  replicas: 1
  selector:
    matchLabels:
      app: edge
  template:
    metadata:
      labels:
        app: edge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: edge
          image: ghost-seeker/edge:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: edge-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "###ZARF_VAR_EDGE_STORAGE###"
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: ghost-seeker
spec:
  type: ClusterIP
  selector:
    app: edge
  ports:
    - name: http
      port: 8081
      targetPort: http
