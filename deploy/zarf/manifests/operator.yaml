apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  namespace: ghost-seeker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operator
  template:
    metadata:
      labels:
        app: operator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghost-seeker/operator:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - "-addr=:8090"
            - "-shore=http://shore:8080"
            - "-edge="
            - "-link-listen="
          env:
            - name: GS_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: operator-auth
                  key: operator-token
                  optional: true
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: operator
  namespace: ghost-seeker
spec:
  type: ClusterIP
  selector:
    app: operator
  ports:
    - name: http
      port: 8090
      targetPort: http
