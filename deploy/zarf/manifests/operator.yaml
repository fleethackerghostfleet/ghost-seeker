apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  namespace: ghost-seeker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operator
  template:
    metadata:
      labels:
        app: operator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghost-seeker/operator:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - "-addr=:8090"
            - '-shore={{ if and (ne "###ZARF_VAR_SHORE_TLS_SECRET###" "") (eq "###ZARF_VAR_OPERATOR_SHORE_URL###" "http://shore:8080") }}https://shore:8080{{ else }}###ZARF_VAR_OPERATOR_SHORE_URL###{{ end }}'
            - "-edge="
            - "-link-listen="
{{ if ne "###ZARF_VAR_SHORE_CA_SECRET###" "" }}
            - "-shore-ca=/run/shore-ca/ca.crt"
{{ end }}
          env:
            - name: GS_DEV_TOKEN_FILE
              value: none
            - name: GS_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: operator-auth
                  key: operator-token
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
{{ if ne "###ZARF_VAR_SHORE_CA_SECRET###" "" }}
            - name: shore-ca
              mountPath: /run/shore-ca
              readOnly: true
{{ end }}
            - name: tmp
              mountPath: /tmp
      volumes:
{{ if ne "###ZARF_VAR_SHORE_CA_SECRET###" "" }}
        - name: shore-ca
          secret:
            secretName: "###ZARF_VAR_SHORE_CA_SECRET###"
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
{{ end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: operator
  namespace: ghost-seeker
spec:
  type: ClusterIP
  selector:
    app: operator
  ports:
    - name: http
      port: 8090
      targetPort: http
