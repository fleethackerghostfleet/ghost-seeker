apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: operator-data
  namespace: "###ZARF_VAR_NAMESPACE###"
spec:
  accessModes: ["ReadWriteOnce"]
{{ if ne "###ZARF_VAR_OPERATOR_STORAGE_CLASS###" "" }}
  storageClassName: "###ZARF_VAR_OPERATOR_STORAGE_CLASS###"
{{ end }}
  resources:
    requests:
      storage: "###ZARF_VAR_OPERATOR_STORAGE###"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  namespace: "###ZARF_VAR_NAMESPACE###"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operator
  template:
    metadata:
      annotations:
        ghost-seeker.io/shore-tls-secret: "###ZARF_VAR_SHORE_TLS_SECRET###"
        ghost-seeker.io/shore-ca-secret: "###ZARF_VAR_SHORE_CA_SECRET###"
        ghost-seeker.io/shore-url: "{{ if and (ne "###ZARF_VAR_SHORE_TLS_SECRET###" "") (eq "###ZARF_VAR_OPERATOR_SHORE_URL###" "http://shore:8080") }}https://shore:8080{{ else }}###ZARF_VAR_OPERATOR_SHORE_URL###{{ end }}"
      labels:
        app: operator
    spec:
      imagePullSecrets:
        - name: private-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "###ZARF_REGISTRY###/ghost-seeker/operator:prod-b6e0f0fa18d1-20261106160717-221ead34"
          imagePullPolicy: IfNotPresent
          args:
            - "-addr=:8090"
            - "-shore={{ if and (ne "###ZARF_VAR_SHORE_TLS_SECRET###" "") (eq "###ZARF_VAR_OPERATOR_SHORE_URL###" "http://shore:8080") }}https://shore:8080{{ else }}###ZARF_VAR_OPERATOR_SHORE_URL###{{ end }}"
            - "-edge="
            - "-link-listen="
            - "-review-log=/data/reviews.jsonl"
{{ if ne "###ZARF_VAR_SHORE_CA_SECRET###" "" }}
            - "-shore-ca=/run/shore-ca/ca.crt"
{{ end }}
          env:
            - name: GS_DEV_TOKEN_FILE
              value: none
            - name: GS_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "###ZARF_VAR_OPERATOR_AUTH_SECRET###"
                  key: "###ZARF_VAR_OPERATOR_OPERATOR_TOKEN_KEY###"
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
{{ if ne "###ZARF_VAR_SHORE_CA_SECRET###" "" }}
            - name: shore-ca
              mountPath: /run/shore-ca
              readOnly: true
{{ end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: operator-data
{{ if ne "###ZARF_VAR_SHORE_CA_SECRET###" "" }}
        - name: shore-ca
          secret:
            secretName: "###ZARF_VAR_SHORE_CA_SECRET###"
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
{{ end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: operator
  namespace: "###ZARF_VAR_NAMESPACE###"
spec:
  type: ClusterIP
  selector:
    app: operator
  ports:
    - name: http
      port: 8090
      targetPort: http
