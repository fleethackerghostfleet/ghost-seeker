apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shore-ingress
  namespace: ghost-seeker
spec:
  podSelector:
    matchLabels:
      app: shore
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: operator
        - podSelector:
            matchLabels:
              app: edge
        - ipBlock:
            cidr: "###ZARF_VAR_SHORE_INGRESS_CIDR###"
      ports:
        - protocol: TCP
          port: 8080
