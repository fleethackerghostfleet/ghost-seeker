apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-ingress
  namespace: ghost-seeker
spec:
  podSelector:
    matchLabels:
      app: edge
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: operator
        - ipBlock:
            cidr: "###ZARF_VAR_EDGE_INGRESS_CIDR###"
      ports:
        - protocol: TCP
          port: 8081
