apiVersion: zarf.dev/v1alpha1
kind: ZarfPackageConfig
metadata:
  name: ghost-seeker
  version: 0.1.0
  architecture: amd64
  description: Ghost Seeker ship-to-shore prioritized sync (production images, -tags prod; INFER_URL must reach an edgeml sidecar).

variables:
  - name: SHORE_EGRESS_CIDR
    description: Approved destination CIDR for edge/operator to routed shore sync, console and API. Documentation-only default; set a narrow site CIDR (never 0.0.0.0/0 or ::/0).
    default: 192.0.2.0/32
    prompt: false
  - name: SHORE_EGRESS_PORT
    description: TCP destination port for SHORE_EGRESS_CIDR; match the configured endpoint, TLS gateway or proxy.
    default: "8080"
    prompt: false
  - name: EDGE_EGRESS_CIDR
    description: Approved destination CIDR for operator to routed edge console. Documentation-only default; set a narrow site CIDR (never 0.0.0.0/0 or ::/0).
    default: 192.0.2.0/32
    prompt: false
  - name: EDGE_EGRESS_PORT
    description: TCP destination port for EDGE_EGRESS_CIDR; match the configured endpoint, TLS gateway or proxy.
    default: "8081"
    prompt: false
  - name: INFERENCE_EGRESS_CIDR
    description: Approved destination CIDR for edge/shore to remote inference or text embedding. Documentation-only default; set a narrow site CIDR (never 0.0.0.0/0 or ::/0).
    default: 192.0.2.0/32
    prompt: false
  - name: INFERENCE_EGRESS_PORT
    description: TCP destination port for INFERENCE_EGRESS_CIDR; match the configured endpoint, TLS gateway or proxy.
    default: "9090"
    prompt: false
  - name: CAMERA_EGRESS_CIDR
    description: Approved destination CIDR for edge to optional GS_MJPEG_URL HTTP(S) camera pull. Documentation-only default; set a narrow site CIDR (never 0.0.0.0/0 or ::/0).
    default: 192.0.2.0/32
    prompt: false
  - name: CAMERA_EGRESS_PORT
    description: TCP destination port for CAMERA_EGRESS_CIDR; match the configured endpoint, TLS gateway or proxy.
    default: "80"
    prompt: false
  - name: LLM_EGRESS_CIDR
    description: Approved destination CIDR for operator to optional GS_LLM_URL OpenAI-compatible endpoint or approved Vertex gateway. Documentation-only default; set a narrow site CIDR (never 0.0.0.0/0 or ::/0).
    default: 192.0.2.0/32
    prompt: false
  - name: LLM_EGRESS_PORT
    description: TCP destination port for LLM_EGRESS_CIDR; match the configured endpoint, TLS gateway or proxy.
    default: "8080"
    prompt: false
  - name: RESEARCH_EGRESS_CIDR
    description: Approved destination CIDR for operator to optional GS_RESEARCH_COMPILER_URL service. Documentation-only default; set a narrow site CIDR (never 0.0.0.0/0 or ::/0).
    default: 192.0.2.0/32
    prompt: false
  - name: RESEARCH_EGRESS_PORT
    description: TCP destination port for RESEARCH_EGRESS_CIDR; match the configured endpoint, TLS gateway or proxy.
    default: "8097"
    prompt: false
  - name: OCSP_EGRESS_CIDR
    description: Approved destination CIDR for operator to optional GS_PIV_OCSP_URL responder. Documentation-only default; set a narrow site CIDR (never 0.0.0.0/0 or ::/0).
    default: 192.0.2.0/32
    prompt: false
  - name: OCSP_EGRESS_PORT
    description: TCP destination port for OCSP_EGRESS_CIDR; match the configured endpoint, TLS gateway or proxy.
    default: "80"
    prompt: false
  - name: MODEL_EGRESS_CIDR
    description: Approved destination CIDR for inference to optional approved model mirror in customized deployments; packaged runtime uses offline mounted models. Documentation-only default; set a narrow site CIDR (never 0.0.0.0/0 or ::/0).
    default: 192.0.2.0/32
    prompt: false
  - name: MODEL_EGRESS_PORT
    description: TCP destination port for MODEL_EGRESS_CIDR; match the configured endpoint, TLS gateway or proxy.
    default: "443"
    prompt: false
  - name: SHORE_INGRESS_CIDR
    description: Approved source CIDR as seen at shore for routed ship sync, remote operators and external API clients. Documentation-only default; set for the deployment (never 0.0.0.0/0).
    default: 192.0.2.0/32
    prompt: false
  - name: EDGE_INGRESS_CIDR
    description: Approved source CIDR as seen at edge for remote operators and live sensor push clients. Documentation-only default; set for the deployment.
    default: 192.0.2.0/32
    prompt: false
  - name: OPERATOR_INGRESS_CIDR
    description: Approved source CIDR as seen at the operator UI for browsers or the ingress gateway. Documentation-only default; set for the deployment.
    default: 192.0.2.0/32
    prompt: false
  - name: INFERENCE_INGRESS_CIDR
    description: Approved source CIDR as seen at inference for separately routed edge/shore clients. Documentation-only default; set when inference is accessed remotely.
    default: 192.0.2.0/32
    prompt: false
  - name: SHORE_TLS_SECRET
    description: Optional existing kubernetes.io/tls Secret for shore; empty keeps HTTP. Setting this also upgrades the default local shore URLs to HTTPS.
    default: ""
    pattern: '^$|^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
    prompt: false
  - name: EDGE_TLS_SECRET
    description: Optional existing kubernetes.io/tls Secret for edge; empty keeps HTTP.
    default: ""
    pattern: '^$|^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
    prompt: false
  - name: SHORE_CA_SECRET
    description: Optional existing Secret with ca.crt PEM roots for edge and operator shore/edge clients; empty uses system roots.
    default: ""
    pattern: '^$|^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
    prompt: false
  - name: OPERATOR_SHORE_URL
    description: Operator upstream shore URL; its default switches to HTTPS with SHORE_TLS_SECRET. Custom URLs must explicitly use https for TLS endpoints.
    default: http://shore:8080
    prompt: false
  - name: SHORE_URL
    description: Edge-to-shore URL; its default switches to HTTPS with SHORE_TLS_SECRET. Custom URLs must explicitly use https for TLS endpoints.
    default: http://shore.ghost-seeker.svc.cluster.local:8080
    prompt: false
  - name: SHORE_PUBLIC_HOSTS
    description: Host names the shore answers to; must include the host of SHORE_URL and any ingress name.
    default: shore,shore.ghost-seeker,shore.ghost-seeker.svc,shore.ghost-seeker.svc.cluster.local
    prompt: false
  - name: EDGE_PUBLIC_HOSTS
    description: Host names the edge answers to.
    default: edge,edge.ghost-seeker,edge.ghost-seeker.svc,edge.ghost-seeker.svc.cluster.local
    prompt: false
  - name: EDGE_ID
    description: Edge identifier (edge component).
    default: edge-1
    prompt: false
  - name: SHORE_REQUIRE_AUTH
    description: Require HS256 unit authentication on shore SyncService (production default; the shore-auth secret must carry signing-key and operator-token).
    default: "true"
    prompt: false
  - name: EDGE_MAX_BYTES
    description: Maximum retained edge form payload bytes; 0 is unlimited.
    default: "0"
    prompt: false
  - name: EDGE_MAX_ITEMS
    description: Maximum retained edge items; 0 is unlimited.
    default: "0"
    prompt: false
  - name: INFER_URL
    description: Edge inference sidecar URL (required; prod images have no built-in analyzer stand-in).
    default: http://edgeml-sidecar:9090
    prompt: false
  - name: SHORE_INFER_URL
    description: Shore text-embedding inference URL; empty disables text search.
    default: ""
    prompt: false
  - name: SHORE_STORAGE
    description: Shore SQLite persistent volume size.
    default: 5Gi
    prompt: false
  - name: EDGE_STORAGE
    description: Edge SQLite persistent volume size.
    default: 10Gi
    prompt: false
  - name: FRAMES_HOSTPATH
    description: Node directory mounted read-only at /frames in the edge pod (sensor frame drop). Production images have no replay; the edge ingests the live input stream.
    default: /var/lib/ghost-seeker/frames
    prompt: false

components:
  - name: namespace
    required: true
    description: ghost-seeker namespace
    manifests:
      - name: namespace
        namespace: ghost-seeker
        files:
          - manifests/namespace.yaml
          - manifests/network-default-deny.yaml
          - manifests/network-default-deny-egress.yaml
  - name: shore
    default: true
    required: false
    description: Shore sync receiver and console with persistent SQLite storage.
    images:
      - ghost-seeker/shore:0.1.0
    manifests:
      - name: shore
        namespace: ghost-seeker
        template: true
        files:
          - manifests/shore.yaml
          - manifests/network-shore.yaml
          - manifests/network-shore-egress.yaml
  - name: operator
    default: true
    required: false
    description: Live operator UI backed by the shore service.
    images:
      - ghost-seeker/operator:0.1.0
    manifests:
      - name: operator
        namespace: ghost-seeker
        template: true
        files:
          - manifests/operator.yaml
          - manifests/network-operator.yaml
          - manifests/network-operator-egress.yaml
  - name: edge
    default: true
    required: false
    description: Edge capture and prioritized sync service with persistent SQLite storage.
    images:
      - ghost-seeker/edge:0.1.0
    manifests:
      - name: edge
        namespace: ghost-seeker
        template: true
        files:
          - manifests/edge.yaml
          - manifests/network-edge.yaml
          - manifests/network-edge-egress.yaml
  - name: edge-inference
    default: false
    required: false
    description: Optional CPU edgeml sidecar in this cluster (the INFER_URL default); deploy it or point INFER_URL at another sidecar.
    images:
      - ghost-seeker/edgeml-sidecar:0.1.0
    manifests:
      - name: edge-inference
        namespace: ghost-seeker
        files:
          - manifests/edge-inference.yaml
          - manifests/network-edge-inference.yaml
          - manifests/network-edge-inference-egress.yaml
