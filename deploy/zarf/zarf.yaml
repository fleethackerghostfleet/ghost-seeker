apiVersion: zarf.dev/v1alpha1
kind: ZarfPackageConfig
metadata:
  name: ghost-seeker
  version: 0.1.0
  architecture: amd64
  description: Ghost Seeker ship-to-shore prioritized sync; set INFER_URL=http://edgeml-sidecar:9090 when enabling edge-inference.

variables:
  - name: SHORE_URL
    description: Edge-to-shore URL; set to a reachable shore address for shipboard edge deployments.
    default: http://shore.ghost-seeker.svc.cluster.local:8080
    prompt: false
  - name: EDGE_ID
    description: Edge identifier (edge component).
    default: edge-1
    prompt: false
  - name: INFER_URL
    description: Inference URL, or mock; use http://edgeml-sidecar:9090 when edge-inference is enabled.
    default: mock
    prompt: false
  - name: SHORE_STORAGE
    description: Shore SQLite persistent volume size.
    default: 5Gi
    prompt: false
  - name: EDGE_STORAGE
    description: Edge SQLite persistent volume size.
    default: 10Gi
    prompt: false
  - name: FRAMES_HOSTPATH
    description: Node directory mounted read-only at /frames in the edge pod (sensor frame drop / replay clips). Empty FRAMES_DIR and SCENARIO leave the edge idle until a sensor source is configured.
    default: /var/lib/ghost-seeker/frames
    prompt: false
  - name: FRAMES_DIR
    description: Frame directory under /frames to replay the built-in scenario from (edge -frames); empty disables replay.
    default: ""
    prompt: false
  - name: SCENARIO
    description: Scenario JSON under /frames to replay into the edge store (edge -scenario); empty disables.
    default: ""
    prompt: false

components:
  - name: namespace
    required: true
    description: ghost-seeker namespace
    manifests:
      - name: namespace
        namespace: ghost-seeker
        files:
          - manifests/namespace.yaml
  - name: shore
    default: true
    required: false
    description: Shore sync receiver and console with persistent SQLite storage.
    images:
      - ghost-seeker/shore:0.1.0
    manifests:
      - name: shore
        namespace: ghost-seeker
        files:
          - manifests/shore.yaml
  - name: operator
    default: true
    required: false
    description: Live operator UI backed by the shore service.
    images:
      - ghost-seeker/operator:0.1.0
    manifests:
      - name: operator
        namespace: ghost-seeker
        files:
          - manifests/operator.yaml
  - name: edge
    default: true
    required: false
    description: Edge capture and prioritized sync service with persistent SQLite storage.
    images:
      - ghost-seeker/edge:0.1.0
    manifests:
      - name: edge
        namespace: ghost-seeker
        files:
          - manifests/edge.yaml
  - name: edge-inference
    default: false
    required: false
    description: Optional CPU edgeml sidecar; set INFER_URL=http://edgeml-sidecar:9090 to connect the edge.
    images:
      - ghost-seeker/edgeml-sidecar:0.1.0
    manifests:
      - name: edge-inference
        namespace: ghost-seeker
        files:
          - manifests/edge-inference.yaml
