apiVersion: zarf.dev/v1alpha1
kind: ZarfPackageConfig
metadata:
  name: ghost-seeker
  version: 0.1.0
  architecture: amd64
  description: Ghost Seeker ship-to-shore prioritized sync (production images, -tags prod; INFER_URL must reach an edgeml sidecar).

variables:
  - name: SHORE_URL
    description: Edge-to-shore URL; set to a reachable shore address for shipboard edge deployments.
    default: http://shore.ghost-seeker.svc.cluster.local:8080
    prompt: false
  - name: SHORE_PUBLIC_HOSTS
    description: Host names the shore answers to; must include the host of SHORE_URL and any ingress name.
    default: shore,shore.ghost-seeker,shore.ghost-seeker.svc,shore.ghost-seeker.svc.cluster.local
    prompt: false
  - name: EDGE_PUBLIC_HOSTS
    description: Host names the edge answers to.
    default: edge,edge.ghost-seeker,edge.ghost-seeker.svc,edge.ghost-seeker.svc.cluster.local
    prompt: false
  - name: EDGE_ID
    description: Edge identifier (edge component).
    default: edge-1
    prompt: false
  - name: SHORE_REQUIRE_AUTH
    description: Require HS256 unit authentication on shore SyncService (production default; the shore-auth secret must carry signing-key and operator-token).
    default: "true"
    prompt: false
  - name: EDGE_MAX_BYTES
    description: Maximum retained edge form payload bytes; 0 is unlimited.
    default: "0"
    prompt: false
  - name: EDGE_MAX_ITEMS
    description: Maximum retained edge items; 0 is unlimited.
    default: "0"
    prompt: false
  - name: INFER_URL
    description: Edge inference sidecar URL (required; prod images have no built-in analyzer stand-in).
    default: http://edgeml-sidecar:9090
    prompt: false
  - name: SHORE_INFER_URL
    description: Shore text-embedding inference URL; empty disables text search.
    default: ""
    prompt: false
  - name: SHORE_STORAGE
    description: Shore SQLite persistent volume size.
    default: 5Gi
    prompt: false
  - name: EDGE_STORAGE
    description: Edge SQLite persistent volume size.
    default: 10Gi
    prompt: false
  - name: FRAMES_HOSTPATH
    description: Node directory mounted read-only at /frames in the edge pod (sensor frame drop). Production images have no replay; the edge ingests the live input stream.
    default: /var/lib/ghost-seeker/frames
    prompt: false
    default: ""
    prompt: false

components:
  - name: namespace
    required: true
    description: ghost-seeker namespace
    manifests:
      - name: namespace
        namespace: ghost-seeker
        files:
          - manifests/namespace.yaml
  - name: shore
    default: true
    required: false
    description: Shore sync receiver and console with persistent SQLite storage.
    images:
      - ghost-seeker/shore:0.1.0
    manifests:
      - name: shore
        namespace: ghost-seeker
        files:
          - manifests/shore.yaml
  - name: operator
    default: true
    required: false
    description: Live operator UI backed by the shore service.
    images:
      - ghost-seeker/operator:0.1.0
    manifests:
      - name: operator
        namespace: ghost-seeker
        files:
          - manifests/operator.yaml
  - name: edge
    default: true
    required: false
    description: Edge capture and prioritized sync service with persistent SQLite storage.
    images:
      - ghost-seeker/edge:0.1.0
    manifests:
      - name: edge
        namespace: ghost-seeker
        files:
          - manifests/edge.yaml
  - name: edge-inference
    default: false
    required: false
    description: Optional CPU edgeml sidecar in this cluster (the INFER_URL default); deploy it or point INFER_URL at another sidecar.
    images:
      - ghost-seeker/edgeml-sidecar:0.1.0
    manifests:
      - name: edge-inference
        namespace: ghost-seeker
        files:
          - manifests/edge-inference.yaml
