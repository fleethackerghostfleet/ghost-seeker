tasks:
  - name: release
    description: Build a versioned split production release (set VERSION).
    actions:
      - cmd: 'make release VERSION="${VERSION:?Set VERSION to x.y.z or x.y.z-rc1}" ARCH="${ARCH:-amd64}"'
  - name: images
    description: Build and pin a new immutable-tag production image set.
    actions:
      - cmd: make pin-images
  - name: ship-package
    description: Package edge and inference for an existing UDS cluster.
    actions:
      - cmd: make zarf-ship
  - name: shore-package
    description: Package shore and operator console for an existing UDS cluster.
    actions:
      - cmd: make zarf-shore
  - name: create-ship-bundle
    actions:
      - cmd: uds create bundles/prod-uds/ship --confirm --output dist
  - name: create-shore-bundle
    actions:
      - cmd: uds create bundles/prod-uds/shore --confirm --output dist
  - name: deploy-ship-bundle
    description: Deploy to the current cluster using administrator-supplied site config and existing Secrets.
    actions:
      - cmd: 'UDS_CONFIG="${UDS_CONFIG:?Set UDS_CONFIG to ship site uds-config.yaml}" uds deploy "${BUNDLE_DIR:-dist}/uds-bundle-ghost-seeker-ship-${ARCH:-amd64}-${VERSION:-$(cat VERSION)}.tar.zst" --confirm'
  - name: deploy-shore-bundle
    description: Deploy to the current cluster using administrator-supplied site config and existing Secrets.
    actions:
      - cmd: 'UDS_CONFIG="${UDS_CONFIG:?Set UDS_CONFIG to shore site uds-config.yaml}" uds deploy "${BUNDLE_DIR:-dist}/uds-bundle-ghost-seeker-shore-${ARCH:-amd64}-${VERSION:-$(cat VERSION)}.tar.zst" --confirm'
